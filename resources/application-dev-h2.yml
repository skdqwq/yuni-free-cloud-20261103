# 没有 Docker / MySQL 时的本地兜底，只用于看界面与跑流程，不作为交付默认。
spring:
  datasource:
    url: jdbc:h2:mem:yuni;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
