meta:
  name: 屿YUNI 剧本型 Agent
  version: "1.0"
  note: >-
    剧本只负责「说什么」，不负责「怎么算」。容量核算、候选生成、缺口展示
    全部由 WrapCardEngine 完成，剧本无法越过规则层给结论。

lines:
  greet:
    gentle: 这么晚还没停下来。先坐一会儿，不急着说事。
    light: 来啦。今晚想聊点什么，或者就先待着也行。
    clear: 我在。今晚最挂心的是哪一件？
  listen_vent:
    gentle: 听起来是那种「知道该做、但身体已经不肯配合」的累。今晚一定要动它吗？
    light: 这强度确实有点顶。要不先把最烦的那件说出来，别的先放着。
    clear: 先记下这件事。今晚必须动它，还是可以先放到明天？
  listen_more:
    gentle: 嗯，我在听。你可以慢慢说，不用组织得很清楚。
    light: 继续，我这边不赶时间。
    clear: 收到，还有别的吗？
  ask_task:
    gentle: 那今晚最挂心的是哪一件？只说一件就好。
    light: 挑最扎手的那件说，其他的今晚不算。
    clear: 今晚要处理的那一件事，具体是什么？
  ask_deadline:
    gentle: 这件事什么时候要交？说个大概时间就行。
    light: 截止时间是哪个点？
    clear: 请给出截止时间，格式可以是「明天上午九点」。
  ask_minutes:
    gentle: 你估摸着，它大概要花多久？说个大概就行，不用精确。
    light: 大概要多久能弄完？
    clear: 预计需要多少分钟？
  ask_window:
    gentle: 今晚你大概能从几点开始，到几点必须停？
    light: 几点到几点有空？
    clear: 可用时间窗是从几点到几点？
  ready:
    gentle: 我按你说的算了一下，先不替你决定，你看这样行不行。
    light: 算完了，几个走法都摆在这儿，你挑。
    clear: 容量核算完成，候选方案如下，请确认。
  card_waiting:
    gentle: 卡片还在这儿，不用急着决定。想换个走法也可以。
    light: 卡还在，挑一个就行，别的不用管。
    clear: 收尾卡待确认，可选择任一候选方案或撤销。
  card_confirmed:
    gentle: 好，那就按这个来。今晚到这儿为止，剩下的明天再说。
    light: 成了。今晚收工，别再想它了。
    clear: 已记录确认。截止时间未改动，可随时撤销。
  card_undone:
    gentle: 撤掉了。今晚不用做任何决定，睡吧。
    light: 好，撤了。这事明天再算。
    clear: 已撤销该卡片，运行记录保留。
  morning:
    gentle: 早。昨晚那张卡还在，要不要看一眼？
    light: 早啊。昨晚的事，今天还算数吗？
    clear: 早上好。昨日收尾卡待处理，可修改或关闭。
  fallback:
    gentle: 我在。你可以说得再具体一点，或者我们先从今晚最挂心的那件事开始。
    light: 没太跟上，换个说法？
    clear: 未识别意图，请描述今晚要处理的事项。
  no_parts:
    gentle: 我还没听清要做什么。要不先说一下那件事的名字？
    light: 还没说要做什么呢。
    clear: 缺少「必须完成的部分」，请补充。

quick:
  greet: ["今天好累", "有件事没做完", "就是睡不着"]
  ask_task: ["作业还没写", "明天要交报告", "复习没开始"]
  ask_deadline: ["明天上午九点", "今晚十二点前", "后天中午"]
  ask_minutes: ["大概一小时", "两三个小时", "说不准"]
  ask_window: ["九点到十一点半", "现在到十二点", "只有一个小时"]
  ready: ["就按这个来", "换一个", "先不做"]
