name: Keep YUNI awake on 2026-11-06

on:
  schedule:
    # China time 14:00–23:50, then disable the workflow at midnight.
    - cron: '*/10 6-15 6 11 *'
    - cron: '0 16 6 11 *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the app during the requested day or disable this schedule
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%Y-%m-%dT%H:%M)" \< "2026-11-06T16:00" ] && [ "$(date -u +%Y-%m-%d)" = "2026-11-06" ]; then
            curl --fail --silent --show-error --max-time 100 https://yuni-free-cloud-20261103.onrender.com/api/health > /dev/null
          else
            gh api --method PUT "repos/$GH_REPO/actions/workflows/yuni-today-wake.yml/disable"
          fi
